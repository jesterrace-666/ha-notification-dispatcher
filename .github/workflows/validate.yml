name: Validate

on:
  pull_request:
  push:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1 @mdi/js@7.4.47
      - name: Test desktop and mobile history panel
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test tests/history-panel.test.cjs
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: ["2026.5.4", "2026.11.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile integration
        run: python -m compileall custom_components
      - name: Install Home Assistant Core
        run: python -m pip install --disable-pip-version-check "homeassistant==${{ matrix.core }}"
      - name: Test notification routing
        run: python -m unittest discover -s tests -v
