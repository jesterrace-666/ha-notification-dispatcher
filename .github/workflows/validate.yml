name: Validate

on:
  pull_request:
  push:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: ["2026.5.4", "2026.11.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile integration
        run: python -m compileall custom_components
      - name: Install Home Assistant Core
        run: python -m pip install --disable-pip-version-check "homeassistant==${{ matrix.core }}"
      - name: Test notification routing
        run: python -m unittest discover -s tests -v
